<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Mosaic, icon A (Tessera)</title>
  <defs>
    <radialGradient id="field" cx="50%" cy="34%" r="78%">
      <stop offset="0" stop-color="#1A1613"/>
      <stop offset="1" stop-color="#080706"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8B4E"/>
      <stop offset="1" stop-color="#F26A2A"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#46413B"/>
      <stop offset="1" stop-color="#37332F"/>
    </linearGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7F786F"/>
      <stop offset="1" stop-color="#6A645D"/>
    </linearGradient>
    <linearGradient id="sage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B0CFB6"/>
      <stop offset="1" stop-color="#97BA9F"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset=".08" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#field)"/>
  <!-- The Room's mark: 9-unit tiles, 2-unit gap, 2-unit radius (u = 28). -->
  <g>
    <rect x="232" y="232" width="252" height="252" rx="52" fill="url(#amber)"/>
    <rect x="540" y="232" width="252" height="252" rx="52" fill="url(#stone)"/>
    <rect x="232" y="540" width="252" height="252" rx="52" fill="url(#clay)"/>
    <rect x="540" y="540" width="252" height="252" rx="52" fill="url(#sage)"/>
  </g>
  <g fill="url(#sheen)">
    <rect x="232" y="232" width="252" height="252" rx="52"/>
    <rect x="540" y="232" width="252" height="252" rx="52"/>
    <rect x="232" y="540" width="252" height="252" rx="52"/>
    <rect x="540" y="540" width="252" height="252" rx="52"/>
  </g>
</svg>
