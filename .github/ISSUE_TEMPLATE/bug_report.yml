name: Bug report
description: Something in Mosaic did not work as expected.
labels: ["bug"]
body:
  - type: textarea
    id: ran
    attributes:
      label: What you ran
      description: The command or the /mosaic request, as you typed it.
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: Include the exact error text if there was one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Setup status
      description: |
        Paste the output of `node data/cli.mjs setup --status`, run inside the clone, or the first-run check output from `/mosaic`.
        It never prints keys or your SEC contact, but read it before you paste.
      render: text
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      description: Output of `node --version`.
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude Code version
      description: Output of `claude --version`.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install type
      options:
        - Marketplace
        - Git clone
    validations:
      required: true
